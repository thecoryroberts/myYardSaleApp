name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore myYardSale.sln
      - name: Build
        run: dotnet build myYardSale.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test myYardSale.sln --configuration Release --no-build
